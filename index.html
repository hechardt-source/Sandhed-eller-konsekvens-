<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandhed eller Konsekvens</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#d7193f;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"♥  ♥  ♥  ♥  ♥  ♥  ♥  ♥  ♥  ♥";position:fixed;inset:0;color:#fff;font-size:35px;line-height:100px;opacity:.18;word-spacing:20px;pointer-events:none;z-index:0}
.app{max-width:600px;margin:auto;min-height:100vh;padding:25px 18px;display:flex;align-items:center}
.card{width:100%;background:#202024;border-radius:28px;padding:28px;box-shadow:0 10px 35px #0008}
h1{text-align:center;font-size:38px;line-height:1.05}
h2{text-align:center}
input{width:100%;padding:16px;margin:7px 0;border:0;border-radius:14px;background:#303034;color:white;font-size:18px}
button{width:100%;padding:17px;margin-top:12px;border:0;border-radius:15px;font-size:19px;font-weight:bold}
.truth{background:#8748e8;color:white}
.dare{background:#e34b69;color:white}
.hidden{display:none}
.category{text-align:center;color:#aaa}
.player{text-align:center;font-size:28px;font-weight:bold;margin:15px 0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.question{text-align:center;font-size:27px;min-height:150px;display:flex;align-items:center;justify-content:center}
.timer{text-align:center;font-size:72px;font-weight:900}
.center{text-align:center;color:#aaa}
</style>
</head>
<body>
<div class="app">

<div id="start" class="card">
<h1>Sandhed<br>eller Konsekvens</h1>
<input id="p1" placeholder="Spiller 1">
<select id="g1">
<option value="female">Dame</option>
<option value="male">Mand</option>
</select>

<input id="p2" placeholder="Spiller 2">
<select id="g2">
<option value="female">Dame</option>
<option value="male">Mand</option>
</select>
<button onclick="start()">START SPIL</button>
</div>

<div id="choose" class="card hidden">
<div class="category" id="cat"></div>
<div class="player" id="who"></div>
<h2>Vælg</h2>
<div class="choice">
<button class="truth" onclick="question('truth')">SANDHED</button>
<button class="dare" onclick="question('dare')">KONSEKVENS</button>
</div>
</div>

<div id="play" class="card hidden">
<div class="category" id="cat2"></div>
<div class="player" id="who2"></div>
<div class="center" id="type"></div>
<div class="question" id="q"></div>
<div class="timer" id="timer">30</div>
<button onclick="answered()">FÆRDIG / HAR SVARET</button>
</div>


  

<div id="ready" class="card hidden">
<h2>Tiden er ude!</h2>
<div class="player" id="next"></div>
<p class="center">Er du klar til næste spørgsmål?</p>
<button onclick="next()">KLAR</button>
</div>

<div id="finish" class="card hidden">
<h1>🎉 Godt spil!</h1>
<p class="center">I har gennemført alle 3 kategorier.</p>
<button onclick="location.reload()">SPIL IGEN</button>
</div>

</div>

<script>
const data={
1:{
  truth:{
    female:[
      "Dame 1",
      "Dame 2",
      "Dame 3",
      "Dame 4",
      "Dame 5"
    ],
    male:[
      "Mand 1",
      "Mand 2",
      "Mand 3",
      "Mand 4",
      "Mand 5"
    ]
  },
  dare:{
    female:[
      "Dame 6",
      "Dame 7",
      "Dame 8",
      "Dame 9",
      "Dame 10"
    ],
    male:[
      "Mand 6",
      "Mand 7",
      "Mand 8",
      "Mand 9",
      "Mand 10"
    ]
  }
},


2:{
truth:[
"Hvad er den største misforståelse, andre har om dig?",
"Hvad ville du ændre ved dig selv?",
"Hvornår har du sidst været virkelig flov?",
"Hvad er det mest impulsive, du har gjort?",
"Hvad er din mest kontroversielle holdning?"
],
dare:[
"Lav en overdreven modelgang.",
"Lav en mini-standup om den anden spiller.",
"Tal kun i spørgsmål i 30 sekunder.",
"Opfør dig som en berømt filmstjerne.",
"Fortæl en almindelig historie som en actionfilm."
]},
3:{
truth:[
"Hvad er den mest modige ting, du har gjort?",
"Hvad er noget, du aldrig har sagt højt før?",
"Hvilken drøm vil du helst realisere?",
"Hvad er det mest pinlige øjeblik, du stadig tænker på?",
"Hvad ville du gøre, hvis ingen kunne dømme dig?"
],
dare:[
"Lav en dramatisk kærlighedserklæring til en genstand.",
"Improvisér en gyserfilmscene.",
"Lav en reklame for dig selv som et produkt.",
"Lav en motivationstale om noget helt banalt.",
"Lav en dramatisk afslutning på spillet."
]},
4:{
truth:[
"Hvad er det mest spontane, du nogensinde har gjort?",
"Hvad er noget, du altid har haft lyst til at prøve?",
"Hvem kender dig bedst?",
"Hvad er din største dårlige vane?",
"Hvad ville du gøre, hvis du kunne være usynlig i én dag?"
],
dare:[
"Dans som om ingen kigger i 30 sekunder.",
"Tal med en anden stemme i ét minut.",
"Lav din bedste imitation af en kendt person.",
"Fortæl en helt opdigtet historie, som om den er sand.",
"Lav din mest overdrevne catwalk gennem rummet."
]}
};

let players=[];
let genders=[];
let category=1;
  letquestionCount=0;
let turn=0;
let timer;
let seconds=30;

function show(id){
document.querySelectorAll(".card").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function start(){
players=[
document.getElementById("p1").value.trim()||"Spiller 1",
document.getElementById("p2").value.trim()||"Spiller 2"
];
genders=[
document.getElementById("g1").value,
document.getElementById("g2").value
];
category=1;
turn=0;
showChoose();
}

function showChoose(){
document.getElementById("cat").textContent="KATEGORI "+category+" AF 4";
document.getElementById("who").textContent=players[turn]+"'s TUR";
show("choose");
}

function question(type){
let list=data[category][type];
if(!Array.isArray(list)) list=list[genders[turn]];
let q=list[Math.floor(Math.random()*list.length)];

document.getElementById("cat2").textContent="KATEGORI "+category;
document.getElementById("who2").textContent=players[turn];
document.getElementById("type").textContent=
type==="truth"?"SANDHED":"KONSEKVENS";
document.getElementById("q").textContent=q;

seconds=30;
document.getElementById("timer").textContent=seconds;
show("play");

clearInterval(timer);
timer=setInterval(()=>{
seconds--;
document.getElementById("timer").textContent=seconds;

if(seconds<=0){
clearInterval(timer);
document.getElementById("next").textContent=players[1-turn];
show("ready");
}
},1000);
}
function answered(){
clearInterval(timer);
document.getElementById("next").textContent=players[1-turn];
show("ready");
}
function next(){
turn=1-turn;

if(turn===0){
category++;
if(category>4){
show("finish");
return;
}
}

showChoose();
}
</script>
</body>
</html>
